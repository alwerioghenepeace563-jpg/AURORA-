name: Build AURORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "api/**"
      - "lib/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Set Android app version
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 1086/' android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName \"1.0.86\"/" android/app/build.gradle
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish updater APK and version metadata
        if: ${{ secrets.LIVELY_UPDATES_TOKEN != '' }}
        env:
          LIVELY_UPDATES_TOKEN: ${{ secrets.LIVELY_UPDATES_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.LIVELY_UPDATES_TOKEN;
          const owner = 'alwerioghenepeace563-jpg';
          const repo = '-Lively_updates';
          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          };
          async function getSha(path) {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, { headers });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error('Could not inspect ' + path + ': HTTP ' + response.status + ' ' + await response.text());
            return (await response.json()).sha;
          }
          async function put(path, message, bytes) {
            const sha = await getSha(path);
            const body = { message, content: Buffer.from(bytes).toString('base64') };
            if (sha) body.sha = sha;
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
              method: 'PUT', headers, body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error('Could not publish ' + path + ': HTTP ' + response.status + ' ' + await response.text());
            console.log('Published ' + path);
          }
          (async () => {
            const apk = fs.readFileSync('android/app/build/outputs/apk/debug/app-debug.apk');
            await put('aurora/AURORA.apk', 'Publish AURORA Android build 1.0.86', apk);
            const metadata = {
              app: 'AURORA',
              packageId: 'com.aurora.assistant',
              versionCode: 1086,
              versionName: '1.0.86',
              minimumSupportedVersionCode: 0,
              apkUrl: 'https://raw.githubusercontent.com/alwerioghenepeace563-jpg/-Lively_updates/main/aurora/AURORA.apk',
              releaseNotes: 'Updated AURORA app build with the latest assistant fixes.',
              publishedAt: new Date().toISOString()
            };
            await put('aurora/version.json', 'Publish AURORA updater metadata 1.0.86', JSON.stringify(metadata, null, 2) + '\\n');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
