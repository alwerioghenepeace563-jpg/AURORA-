name: Build AURORA Android APK
# Keep the established AURORA signing key and Lively Updates publisher.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      HAS_AURORA_DEBUG_KEYSTORE: ${{ secrets.AURORA_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_LIVELY_UPDATES_TOKEN: ${{ secrets.AURORA_LIVELY_PUBLISHER != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Set version for web updater
        run: |
          echo "VITE_AURORA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VITE_AURORA_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install AURORA native Android bridge
        shell: bash
        run: |
          JAVA_DIR="android/app/src/main/java/com/aurora/assistant"
          mkdir -p "$JAVA_DIR" android/app/src/main/res/xml
          cat > "$JAVA_DIR/AuroraNativePlugin.java" <<'JAVA'
          package com.aurora.assistant;

          import android.content.Intent;
          import android.provider.Settings;
          import android.text.TextUtils;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AuroraNative")
          public class AuroraNativePlugin extends Plugin {
            @PluginMethod
            public void openAccessibilitySettings(PluginCall call) {
              try {
                Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                getActivity().startActivity(intent);
                call.resolve();
              } catch (Exception e) {
                call.reject("Could not open Android Accessibility settings.", e);
              }
            }

            @PluginMethod
            public void isAccessibilityEnabled(PluginCall call) {
              String enabled = Settings.Secure.getString(
                getContext().getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
              boolean active = false;
              if (!TextUtils.isEmpty(enabled)) {
                String expected = getContext().getPackageName() + "/" + AuroraScreenReaderService.class.getName();
                for (String item : enabled.split(":")) {
                  if (expected.equalsIgnoreCase(item) ||
                      item.toLowerCase().contains(AuroraScreenReaderService.class.getSimpleName().toLowerCase())) {
                    active = true;
                    break;
                  }
                }
              }
              JSObject result = new JSObject();
              result.put("enabled", active);
              call.resolve(result);
            }

            @PluginMethod
            public void readScreen(PluginCall call) {
              String screenText = AuroraScreenReaderService.getLatestScreenText();
              if (screenText == null || screenText.trim().isEmpty()) {
                call.reject("No screen text is available yet. Enable AURORA Screen Reader in Accessibility settings, return to the app, then try again.");
                return;
              }
              JSObject result = new JSObject();
              result.put("text", screenText);
              call.resolve(result);
            }
          }
          JAVA
          cat > "$JAVA_DIR/AuroraScreenReaderService.java" <<'JAVA'
          package com.aurora.assistant;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.ArrayDeque;
          import java.util.Deque;

          public class AuroraScreenReaderService extends AccessibilityService {
            private static volatile String latestScreenText = "";
            private static final int MAX_CHARS = 12000;

            public static String getLatestScreenText() { return latestScreenText; }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null) return;
              StringBuilder out = new StringBuilder();
              Deque<AccessibilityNodeInfo> stack = new ArrayDeque<>();
              stack.push(root);
              while (!stack.isEmpty() && out.length() < MAX_CHARS) {
                AccessibilityNodeInfo node = stack.pop();
                CharSequence text = node.getText();
                CharSequence desc = node.getContentDescription();
                append(out, text);
                if (desc != text) append(out, desc);
                for (int i = node.getChildCount() - 1; i >= 0; i--) {
                  AccessibilityNodeInfo child = node.getChild(i);
                  if (child != null) stack.push(child);
                }
              }
              String value = out.toString().trim();
              if (!value.isEmpty()) latestScreenText = value;
            }

            private static void append(StringBuilder out, CharSequence value) {
              if (value == null || value.length() == 0 || out.length() >= MAX_CHARS) return;
              String clean = value.toString().trim();
              if (clean.isEmpty()) return;
              if (out.length() > 0) out.append('\n');
              out.append(clean);
              if (out.length() > MAX_CHARS) out.setLength(MAX_CHARS);
            }

            @Override public void onInterrupt() { }
          }
          JAVA
          cat > android/app/src/main/res/xml/aurora_accessibility_service.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="150"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows" />
          XML
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          service_name = "com.aurora.assistant.AuroraScreenReaderService"
          if not any(el.tag == "service" and el.get(ns + "name") == service_name for el in app):
              service = ET.SubElement(app, "service")
              service.set(ns + "name", service_name)
              service.set(ns + "label", "AURORA Screen Reader")
              service.set(ns + "permission", "android.permission.BIND_ACCESSIBILITY_SERVICE")
              service.set(ns + "exported", "true")
              intent = ET.SubElement(service, "intent-filter")
              ET.SubElement(intent, "action").set(ns + "name", "android.accessibilityservice.AccessibilityService")
              meta = ET.SubElement(service, "meta-data")
              meta.set(ns + "name", "android.accessibilityservice")
              meta.set(ns + "resource", "@xml/aurora_accessibility_service")
          manifest.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
          MAIN="$JAVA_DIR/MainActivity.java"
          if [ ! -f "$MAIN" ]; then
            find android/app/src/main/java -name MainActivity.java -print -quit | xargs -r -I{} cp "{}" "$MAIN"
          fi
          if [ ! -f "$MAIN" ]; then echo "Could not locate generated MainActivity.java"; exit 1; fi
          if ! grep -q 'registerPlugin(AuroraNativePlugin.class)' "$MAIN"; then
            python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.aurora.assistant.AuroraNativePlugin;")
          s = s.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(AuroraNativePlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          p.write_text(s)
          PY
          fi
          echo "Installed AURORA native bridge and accessibility service."
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore stable Android signing key
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE == 'true' }}
        env:
          AURORA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURORA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$AURORA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Set Android app version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '${VERSION_NAME}'/" android/app/build.gradle
          echo "AURORA_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "AURORA_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK archive
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          jarsigner -verify "$APK"
      - name: Publish update to Lively Updates
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE == 'true' && env.HAS_LIVELY_UPDATES_TOKEN == 'true' }}
        env:
          LIVELY_UPDATES_TOKEN: ${{ secrets.AURORA_LIVELY_PUBLISHER }}
        run: |
          git clone "https://x-access-token:${LIVELY_UPDATES_TOKEN}@github.com/alwerioghenepeace563-jpg/-Lively_updates.git" /tmp/lively-updates
          mkdir -p /tmp/lively-updates/aurora
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/lively-updates/aurora/AURORA.apk
          cat > /tmp/lively-updates/aurora/version.json <<EOF
          {
            "app": "AURORA",
            "packageId": "com.aurora.assistant",
            "versionCode": ${AURORA_VERSION_CODE},
            "versionName": "${AURORA_VERSION_NAME}",
            "minimumSupportedVersionCode": 0,
            "apkUrl": "https://raw.githubusercontent.com/alwerioghenepeace563-jpg/-Lively_updates/main/aurora/AURORA.apk",
            "releaseNotes": "AURORA Android update with verified package and stable signing from commit ${GITHUB_SHA:0:7}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd /tmp/lively-updates
          git config user.name "AURORA Update Bot"
          git config user.email "aurora-update-bot@users.noreply.github.com"
          git add aurora/AURORA.apk aurora/version.json
          git commit -m "Publish AURORA Android ${AURORA_VERSION_NAME}"
          git push origin HEAD:main
      - name: Warn if existing updater credentials are missing
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE != 'true' || env.HAS_LIVELY_UPDATES_TOKEN != 'true' }}
        run: echo "::warning::The established AURORA_DEBUG_KEYSTORE_BASE64 and AURORA_LIVELY_PUBLISHER secrets are needed to publish an installable update signed with the existing key."
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AURORA-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
