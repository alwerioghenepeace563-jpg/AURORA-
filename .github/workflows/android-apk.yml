name: Build AURORA Android APK
# Use the new persistent local Android debug signing identity and Lively Updates publisher.

on:
  # Build a fresh debug APK whenever app or Android sources change on main.
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/android-apk.yml"
  # Keep manual release preparation available too.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    env:
      HAS_AURORA_DEBUG_KEYSTORE: ${{ secrets.AURORA_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD != '' }}
      HAS_LIVELY_UPDATES_TOKEN: ${{ secrets.AURORA_LIVELY_PUBLISHER != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Set version for web updater
        run: |
          echo "VITE_AURORA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VITE_AURORA_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify Android feature integration
        run: npm run android:check
      - name: Confirm Android project is present
        run: test -f android/app/build.gradle && test -f android/app/src/main/AndroidManifest.xml
      - name: Install native assistant foundation
        run: node scripts/patch-android-native.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Download Gradle distribution with network retries
        run: |
          set -euo pipefail
          GRADLE_ZIP="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
            "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip" \
            --output "$GRADLE_ZIP"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$RUNNER_TEMP/gradle-8.11.1/bin/gradle" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/gradle-8.11.1/bin/gradle"
      - name: Compile native Android code before signing
        run: |
          "$GRADLE_BIN" -p android :app:compileDebugJavaWithJavac --no-daemon
      - name: Restore stable Android signing key
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE == 'true' }}
        env:
          AURORA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURORA_DEBUG_KEYSTORE_BASE64 }}
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          python3 - <<'PY'
          import base64, os, re, sys, unicodedata
          raw = os.environ["AURORA_DEBUG_KEYSTORE_BASE64"].lstrip("\\ufeff")
          # Accept plain/URL-safe Base64, data URLs, quoted values, and certutil
          # output. Ignore invisible Unicode formatting characters sometimes
          # introduced by copy/paste, but never discard visible payload symbols.
          if raw.startswith("data:") and "," in raw:
              raw = raw.split(",", 1)[1]
          raw = raw.strip().strip(chr(34) + chr(39))
          raw = "".join(ch for ch in raw if not ch.isspace() and unicodedata.category(ch) != "Cf")
          candidates = []
          compact = raw.replace("-", "+").replace("_", "/")
          candidates.append(compact)
          payload_lines = []
          for line in raw.splitlines():
              line = line.strip().strip(chr(34) + chr(39))
              if not line or line.startswith("-----") or line.lower().startswith(("certutil:", "input length", "output length")):
                  continue
              if re.fullmatch(r"[A-Za-z0-9+/=_-]+", line):
                  payload_lines.append(line)
          if payload_lines:
              filtered = "".join(payload_lines).replace("-", "+").replace("_", "/")
              if filtered not in candidates:
                  candidates.append(filtered)
          decoded = None
          for value in candidates:
              value = value.rstrip("=")
              if len(value) % 4 == 1:
                  continue
              value += "=" * (-len(value) % 4)
              try:
                  decoded = base64.b64decode(value, validate=True)
                  if decoded:
                      break
              except Exception:
                  pass
          if not decoded:
              compact_len = len(re.sub(r"\\s+", "", raw))
              unsupported = [(i, f"U+{ord(ch):04X}") for i, ch in enumerate(raw) if ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=_-"]
              detail = ",".join(f"position={i}:{code}" for i, code in unsupported[:5]) or "none"
              print(f"::error::Signing secret format is invalid. Length={len(raw)}, compact_length={compact_len}, compact_length_mod4={compact_len % 4}, unsupported_character_metadata={detail}. Secret contents were not logged.")
              sys.exit(1)
          with open(os.path.expanduser("~/.android/debug.keystore"), "wb") as key:
              key.write(decoded)
          print(f"Decoded signing keystore file ({len(decoded)} bytes); secret contents were not logged.")
          PY
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass "$AURORA_KEYSTORE_PASSWORD" -alias aurora-release >/dev/null
          echo "New AURORA signing keystore and alias verified."
      - name: Set Android app version
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '${VERSION_NAME}'/" android/app/build.gradle
          echo "AURORA_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "AURORA_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
        run: |
          "$GRADLE_BIN" -p android assembleDebug --no-daemon
      - name: Verify APK archive
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          jarsigner -verify "$APK"
      - name: Verify established AURORA signing identity
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE == 'true' }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="8cfe8f94aafec120857cec2b5c545011a3a63278e190591d0646a4c888a6fe2a"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AURORA signing certificate mismatch against the new key. Refusing to publish this APK."
            exit 1
          fi
          echo "AURORA signing certificate verified."
      - name: Publish update to Lively Updates
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE == 'true' && env.HAS_LIVELY_UPDATES_TOKEN == 'true' }}
        env:
          LIVELY_UPDATES_TOKEN: ${{ secrets.AURORA_LIVELY_PUBLISHER }}
        run: |
          git clone "https://x-access-token:${LIVELY_UPDATES_TOKEN}@github.com/alwerioghenepeace563-jpg/-Lively_updates.git" /tmp/lively-updates
          mkdir -p /tmp/lively-updates/aurora
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/lively-updates/aurora/AURORA.apk
          cat > /tmp/lively-updates/aurora/version.json <<EOF
          {
            "app": "AURORA",
            "packageId": "com.aurora.assistant",
            "versionCode": ${AURORA_VERSION_CODE},
            "versionName": "${AURORA_VERSION_NAME}",
            "minimumSupportedVersionCode": 0,
            "apkUrl": "https://raw.githubusercontent.com/alwerioghenepeace563-jpg/-Lively_updates/main/aurora/AURORA.apk",
            "releaseNotes": "AURORA Android update with verified package and stable signing from commit ${GITHUB_SHA:0:7}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd /tmp/lively-updates
          git config user.name "AURORA Update Bot"
          git config user.email "aurora-update-bot@users.noreply.github.com"
          git add aurora/AURORA.apk aurora/version.json
          git commit -m "Publish AURORA Android ${AURORA_VERSION_NAME}"
          git push origin HEAD:main
      - name: Warn if new signing or updater credentials are missing
        if: ${{ env.HAS_AURORA_DEBUG_KEYSTORE != 'true' || env.HAS_AURORA_KEY_PASSWORD != 'true' || env.HAS_LIVELY_UPDATES_TOKEN != 'true' }}
        run: echo "::warning::AURORA_DEBUG_KEYSTORE_BASE64, AURORA_KEYSTORE_PASSWORD, and AURORA_LIVELY_PUBLISHER are required for a fully signed and published AURORA APK."
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AURORA-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
