name: Build AURORA Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/true-native-android]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-apk.yml"

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build native Android APK
        run: gradle -p android-native :app:assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v5
        with:
          name: AURORA-Native-Android-Preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
