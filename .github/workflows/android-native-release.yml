name: Build and publish signed AURORA Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "aurora-v*"

permissions:
  contents: write

jobs:
  release-native-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release tag and signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != aurora-v* ]]; then
            echo "::error::Run this workflow on a tag named aurora-vX.Y.Z, for example aurora-v0.1.1."
            exit 1
          fi
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure AURORA_KEYSTORE_BASE64, AURORA_KEYSTORE_PASSWORD, AURORA_KEY_ALIAS and AURORA_KEY_PASSWORD repository secrets first."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-native/release-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/android-native/release-key.jks"

      - name: Build signed release APK
        env:
          AURORA_KEYSTORE_PATH: ${{ github.workspace }}/android-native/release-key.jks
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#aurora-v}"
          gradle -p android-native :app:assembleRelease \
            -PauroraVersionCode="$GITHUB_RUN_NUMBER" \
            -PauroraVersionName="$VERSION_NAME"
          mv android-native/app/build/outputs/apk/release/app-release.apk "AURORA-${VERSION_NAME}-release.apk"
          rm -f "$GITHUB_WORKSPACE/android-native/release-key.jks"

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AURORA ${{ github.ref_name }}
          generate_release_notes: true
          files: AURORA-*-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: AURORA-Signed-Release
          path: AURORA-*-release.apk
          retention-days: 30
