name: AURORA Build Check

on:
  push:
    branches: [main, feature/aurora-pulse-profile-overlay, feat/aurora-latest-plan-audit-fixes, fix/vercel-hobby-function-limit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Report dependency security audit (non-blocking)
        run: |
          npm audit --json > "$RUNNER_TEMP/aurora-npm-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = process.env.RUNNER_TEMP + '/aurora-npm-audit.json';
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            console.log('Dependency audit totals:', JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via || []).filter(v => typeof v === 'object').map(v => ({
                  title: v.title,
                  url: v.url,
                  range: v.range
                }))
              }));
            }
          } catch (error) {
            console.log('Audit report could not be parsed:', error.message);
          }
          NODE
      - name: Enforce dependency security audit
        run: npm audit --audit-level=low
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Run AURORA core and architecture tests
        run: npm run test:core
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Compile Android native code with transient Maven retry
        shell: bash
        run: |
          set -u
          cd android
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/aurora-gradle-attempt-$attempt.log"
            echo "Gradle compile attempt $attempt/3"
            if bash ./gradlew :app:compileDebugJavaWithJavac --no-daemon --max-workers=2 >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
              cat "$log_file"
              if [[ "$attempt" -lt 3 ]] && grep -Eiq 'HTTP 429|status code 429|Too Many Requests|Could not GET|Read timed out|Connection reset|status code 5[0-9][0-9]' "$log_file"; then
                delay=$((attempt * 20))
                echo "Temporary Maven/repository network failure detected; retrying in $delay seconds."
                sleep "$delay"
              else
                exit "$status"
              fi
            fi
          done
          exit 1
