name: AURORA Manual Core Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-manual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out AURORA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repository currently has no committed npm lockfile, so npm ci
      # and setup-node's npm cache cannot work. Install from package.json.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Type-check application
        run: npm run typecheck

      - name: Verify Android feature parity
        run: npm run android:check

      - name: Run AURORA core and architecture tests
        run: npm run test:core

      - name: Build web application
        run: npm run build

      - name: Report verification scope
        if: success()
        run: echo "AURORA type-check, Android feature parity, core tests and web build passed. No APK was built, no signing key was accessed, and no update was published."
