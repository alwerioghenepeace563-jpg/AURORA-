name: AURORA Manual Core Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-manual-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out AURORA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository has no committed npm lockfile.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      # AURORA is currently JavaScript/JSX-first. Run tsc when TS sources
      # exist, but do not fail an otherwise valid build for an empty include.
      - name: Type-check application when TypeScript sources exist
        shell: bash
        run: |
          if (find api src -type f -name '*.ts' -print -quit 2>/dev/null; find api src -type f -name '*.tsx' -print -quit 2>/dev/null) | grep -q .; then
            npm run typecheck
          else
            echo "No TypeScript source files found; JavaScript/JSX validation continues through the regression suite and production build."
          fi

      - name: Verify Android feature parity
        run: npm run android:check

      - name: Run AURORA core and architecture tests
        run: npm run test:core

      - name: Build web application
        run: npm run build

      - name: Report verification scope
        if: success()
        run: echo "AURORA Android feature parity, core tests and web build passed. TypeScript was checked if sources exist. No APK was built, no signing key was accessed, and no update was published."
