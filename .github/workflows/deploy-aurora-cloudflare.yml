name: Deploy AURORA to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to publish the current branch to Cloudflare
        required: true
        type: choice
        options:
          - NO
          - DEPLOY
      worker_url:
        description: Exact deployed workers.dev HTTPS origin for the post-deploy smoke test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build AURORA frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare/aurora-api
        run: npm install --no-audit --no-fund

      - name: Run deployment preflight
        working-directory: cloudflare/aurora-api
        run: npm run test:preflight

      - name: Validate deployment inputs before publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AURORA_WORKER_URL: ${{ inputs.worker_url }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub Secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub Secret"; exit 1; }
          node --input-type=module -e '
            const raw = process.env.AURORA_WORKER_URL || "";
            let url;
            try { url = new URL(raw); } catch { throw new Error("worker_url must be a valid HTTPS origin"); }
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) {
              throw new Error("worker_url must be a bare HTTPS origin without credentials, path, query, or fragment");
            }
            if (!url.hostname.endsWith(".workers.dev")) {
              throw new Error("worker_url must use the expected workers.dev hostname");
            }
          '

      - name: Deploy frontend and API Worker together
        working-directory: cloudflare/aurora-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed Worker and hosted application
        working-directory: cloudflare/aurora-api
        env:
          AURORA_WORKER_URL: ${{ inputs.worker_url }}
        run: npm run test:deployed
