<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.edge{position:absolute;pointer-events:none;opacity:.27;filter:blur(2px)}
.top,.bottom{left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ff6ec7,#ffd36e,#72f0c6,#61cfff,#b58cff,transparent);box-shadow:0 0 12px #bd80ff}
.top{top:0}.bottom{bottom:0}
.left,.right{top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent,#ff6ec7,#ffd36e,#72f0c6,#61cfff,#b58cff,transparent);box-shadow:0 0 12px #bd80ff}
.left{left:0}.right{right:0}
.glow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 24px rgba(173,105,255,.09),inset 0 0 18px rgba(85,211,255,.06)}
</style></head><body><i class="edge top"></i><i class="edge bottom"></i><i class="edge left"></i><i class="edge right"></i><i class="glow"></i></body></html>
