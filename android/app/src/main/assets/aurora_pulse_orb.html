<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:grid;place-items:center}button{position:relative;width:72px;height:72px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;outline:0;-webkit-tap-highlight-color:transparent}.aura{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(#ff6ec7,#a78bfa,#54d8ff,#5ef0cf,#ffe17b,#ff8bcb);filter:blur(8px);opacity:.9;animation:swirl 5s linear infinite}.core{position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 34% 25%,#fff,#e7dcff 13%,#b4a5ff 30%,#60d9f7 53%,#273b83 76%,#10162d);box-shadow:inset 0 0 12px #fff8,0 0 20px #9b8bff88}.halo{position:absolute;inset:0;border-radius:50%;border:1px solid #d8d2ff66;animation:breathe 2.8s ease-in-out infinite}@keyframes swirl{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.12);opacity:.35}}button:active .core{transform:scale(.9)}</style></head><body><button aria-label="Open AURORA Pulse" onclick="window.AuroraOverlay&&window.AuroraOverlay.showPanel()"><span class="aura"></span><span class="core"></span><span class="halo"></span></button></body></html>
