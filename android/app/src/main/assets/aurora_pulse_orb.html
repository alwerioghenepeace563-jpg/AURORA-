<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:grid;place-items:center}
button{position:relative;width:72px;height:66px;border:0;border-radius:30px;background:rgba(3,13,35,.46);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;outline:0;-webkit-tap-highlight-color:transparent;box-shadow:0 0 18px #087eff55,inset 0 0 0 1px #52cfff55}
.wave{position:absolute;inset:8px 3px;border-radius:28px;background:linear-gradient(90deg,transparent,#22d7ff,#b14cff,#22d7ff,transparent);filter:blur(7px);opacity:.9}
.wave:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5px,#28dfff 6px 8px,transparent 9px 12px);clip-path:polygon(0 48%,10% 48%,15% 25%,19% 78%,24% 8%,29% 90%,34% 38%,39% 55%,44% 20%,50% 85%,55% 45%,60% 10%,65% 78%,70% 35%,76% 55%,81% 18%,87% 75%,93% 45%,100% 45%)}
.core{position:relative;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 28% 22%,#fff 0,#8ff3ff 13%,#1aa7c9 34%,#167eff 54%,#5d3cff 73%,#e348ff 90%);box-shadow:0 0 12px #42dfff,0 0 25px #435bff,0 0 38px #8d39ff}
.halo{position:absolute;inset:3px;border-radius:28px;border:1px solid #d8eaff66;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);opacity:.35}}button:active .core{transform:scale(.9)}
button[data-state="listening"] .halo{animation-duration:.7s;border-color:#65e9ff;box-shadow:0 0 18px #65e9ff}
button[data-state="thinking"] .wave{animation:think .7s linear infinite;filter:blur(10px)}
button[data-state="speaking"] .core{animation:speak .55s ease-in-out infinite alternate}
@keyframes speak{to{transform:scale(1.12);filter:brightness(1.35)}}@keyframes think{to{transform:rotate(360deg)}}
</style></head><body><button aria-label="Open AURORA Pulse" onclick="window.AuroraOverlay&&window.AuroraOverlay.showPanel()"><span class="wave"></span><span class="core"></span><span class="halo"></span></button><script>function setOrbState(s){document.querySelector('button').dataset.state=s||'idle'}</script></body></html>
