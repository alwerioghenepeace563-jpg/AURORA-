<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:grid;place-items:center}
button{position:relative;width:76px;height:76px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;outline:0;-webkit-tap-highlight-color:transparent}
.aura{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,#ff6ec7,#ffd36e,#72f0c6,#61cfff,#b58cff,#ff6ec7);filter:blur(9px);opacity:.9;animation:swirl 7s linear infinite}
.core{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fff 0 6%,#ffe8ff 11%,#ff9eea 23%,#a889ff 42%,#548fff 61%,#48dfdf 79%,#ffe08a 100%);box-shadow:inset -8px -10px 18px #15133888,inset 4px 5px 12px #fff9,0 0 22px #9b8bff99}
.inner{position:absolute;inset:17px;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff8,transparent 58%);filter:blur(3px)}
.halo{position:absolute;inset:-1px;border-radius:50%;border:1px solid #f8eaff88;animation:breathe 3s ease-in-out infinite;box-shadow:0 0 18px #bd8cff55}
@keyframes swirl{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.13);opacity:.3}}
button:active .core{transform:scale(.9)}
button[data-state="listening"] .halo{animation-duration:.7s;border-color:#65e9ff;box-shadow:0 0 20px #65e9ff}
button[data-state="thinking"] .aura{animation-duration:1.2s;filter:blur(12px) saturate(1.5)}
button[data-state="speaking"] .core{animation:speak .48s ease-in-out infinite alternate}
@keyframes speak{to{transform:scale(1.12);filter:brightness(1.3)}}
</style></head><body><button aria-label="Open AURORA Pulse" onclick="window.AuroraOverlay&&window.AuroraOverlay.showPanel()"><span class="aura"></span><span class="core"></span><span class="inner"></span><span class="halo"></span></button><script>function setOrbState(s){document.querySelector('button').dataset.state=s||'idle'}</script></body></html>
