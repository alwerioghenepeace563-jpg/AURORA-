<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--glass-alpha:.64;--ink:#edf4ff;--muted:#9eabc0;--cyan:#62e8f4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.shell{height:100%;padding:12px;border:1px solid #a7c8ff35;border-radius:25px;background:rgba(10,16,32,var(--glass-alpha));backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);box-shadow:0 14px 44px #0005,inset 0 1px #ffffff18;display:flex;flex-direction:column;gap:9px}.top{display:flex;align-items:center;gap:8px}.brand{font-weight:800;letter-spacing:.12em;font-size:12px}.status{margin-left:auto;color:#6ce6bd;font-size:10px}.close{border:0;background:#ffffff12;color:#fff;border-radius:50%;width:28px;height:28px;font-size:17px}.reply{display:none;max-height:100px;overflow:auto;padding:8px 10px;border-radius:13px;background:#ffffff10;color:#e8efff;font-size:12px;line-height:1.45;white-space:pre-wrap}.composer{display:flex;align-items:center;gap:8px;margin-top:auto;padding:8px 9px;border-radius:17px;background:#ffffff12;border:1px solid #ffffff20}input[type=text]{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:14px system-ui}input::placeholder{color:#a9b5c8}.send,.tools{border:0;color:#fff;background:linear-gradient(135deg,#27cde6,#8161ed);border-radius:50%;width:36px;height:36px;font-size:16px}.bottom{display:flex;align-items:center;justify-content:space-between}.hint{font-size:9px;letter-spacing:.12em;color:#9aa9c2}.tools{width:34px;height:34px;background:#ffffff16;border:1px solid #ffffff26;color:#d7d1ff}.cards{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px;border-radius:15px;background:#080e1dcc;border:1px solid #ffffff1c}.cards.open{display:grid}.card{min-height:55px;border:1px solid #ffffff1b;border-radius:12px;background:#ffffff0b;color:#eaf1ff;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.card b{font-size:17px;font-weight:500;color:var(--cyan)}.settings{display:none;align-items:center;gap:8px;padding:4px 2px;color:#aebbd0;font-size:10px}.settings.open{display:flex}.settings input{accent-color:#8d78ff}
</style></head><body><main class="shell"><div class="top"><span style="font-size:17px;color:#71e5f5">✧</span><span class="brand">AURORA PULSE</span><span class="status">● READY</span><button class="close" aria-label="Close panel" onclick="hidePanel()">×</button></div><div id="reply" class="reply" role="status" aria-live="polite"></div><div id="cards" class="cards"><button class="card" onclick="tool('Weather')"><b>☼</b>Weather</button><button class="card" onclick="tool('Calendar')"><b>▦</b>Calendar</button><button class="card" onclick="tool('Tasks')"><b>✓</b>Tasks</button><button class="card" onclick="tool('Email')"><b>✉</b>Email</button><button class="card" onclick="tool('Open Apps')"><b>▦</b>Apps</button><button class="card" onclick="tool('More tools')"><b>✧</b>More</button></div><div id="settings" class="settings"><span>Glass opacity</span><input id="opacity" type="range" min="15" max="90" value="64" oninput="setOpacity(this.value)"><span id="opacityValue">64%</span></div><div class="composer"><input id="prompt" type="text" placeholder="Ask AURORA…" autocomplete="off" aria-label="Ask AURORA"><button class="send" onclick="sendPrompt()" aria-label="Send">➤</button></div><div class="bottom"><span class="hint">YOUR AI, OVER YOUR SCREEN</span><div style="display:flex;gap:7px"><button class="tools" onclick="toggleSettings()" aria-label="Glass settings">⚙</button><button class="tools" onclick="toggleTools()" aria-label="Open tools">▦</button></div></div></main><script>
function hidePanel(){if(window.AuroraOverlay&&AuroraOverlay.hidePanel)AuroraOverlay.hidePanel()}function toggleTools(){document.getElementById('cards').classList.toggle('open')}function toggleSettings(){document.getElementById('settings').classList.toggle('open')}function setOpacity(v){document.documentElement.style.setProperty('--glass-alpha',String(Number(v)/100));document.getElementById('opacityValue').textContent=v+'%';try{localStorage.setItem('aurora-pulse-opacity',v)}catch(e){}}try{const v=localStorage.getItem('aurora-pulse-opacity');if(v){document.getElementById('opacity').value=v;setOpacity(v)}}catch(e){}
function showReply(t){const e=document.getElementById('reply');e.style.display='block';e.textContent=t}
async function tool(n){const p=document.getElementById('prompt');const q={'Weather':'What is the weather?','Calendar':'Open my calendar','Tasks':'Show my tasks','Email':'Open my email','More tools':'Show me more tools'};document.getElementById('cards').classList.remove('open');if(n==='Open Apps'){let a=[];try{a=JSON.parse(AuroraOverlay.getInstalledApps()||'[]')}catch(e){}showReply(a.slice(0,10).map(x=>x.name).join(' • ')||'No launchable apps found. Ask me to open an app by name.');return}p.value=q[n]||n;sendPrompt()}
async function sendPrompt(){const p=document.getElementById('prompt'),t=p.value.trim();if(!t)return;showReply('AURORA is thinking…');document.querySelector('.send').disabled=true;try{const r=await fetch('https://aurora-ten-gold.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}],profile:{}})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch(e){}if(!r.ok)throw new Error(d.error||('Chat API HTTP '+r.status));showReply(String(d.reply||'AURORA returned an empty response.'));p.value=''}catch(e){showReply(e.message||'Could not reach AURORA.')}finally{document.querySelector('.send').disabled=false}}document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendPrompt()}});
</script></body></html>
