</style></head><body><main class="shell">

</main><script>
const PULSE_SESSION_KEY='aurora-pulse-session';
function loadPulseSession(){try{const value=JSON.parse(localStorage.getItem(PULSE_SESSION_KEY)||'[]');return Array.isArray(value)?value.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string'&&m.content.trim()).slice(-40):[]}catch(e){return[]}}
function savePulseSession(){try{localStorage.setItem(PULSE_SESSION_KEY,JSON.stringify(pulseSession.slice(-40)))}catch(e){}}
let pulseSession=loadPulseSession();
function addPulseMessage(role,content){pulseSession.push({role,content:String(content||'')});pulseSession=pulseSession.slice(-40);savePulseSession()}
function loadPulseProfile(){try{const value=JSON.parse(localStorage.getItem('aurora-profile')||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch(e){return{}}}
let pulseListening=false;
function setPulseListening(active){pulseListening=!!active;const button=document.getElementById('micButton');if(button){button.classList.toggle('listening',pulseListening);button.textContent=pulseListening?'■':'🎙';button.setAttribute('aria-label',pulseListening?'Stop listening':'Speak to AURORA')}setOrbState(pulseListening?'listening':'idle')}
function togglePulseListening(){if(!window.AuroraOverlay||typeof AuroraOverlay.startVoiceInput!=='function'){showReply('Voice input is not available in this AURORA build.');return}if(pulseListening){try{AuroraOverlay.stopVoiceInput()}catch(e){}setPulseListening(false);return}try{const result=JSON.parse(String(AuroraOverlay.startVoiceInput()||'{}'));if(!(result.started||result.opened)){showReply(result.message||'AURORA could not start voice input.');setPulseListening(false);return}setPulseListening(true);showReply('Listening… speak clearly, then pause.')}catch(e){showReply('Could not start the microphone. Check AURORA microphone permission.');setPulseListening(false)}}
let pulseConversationActive=false;
let pulseAutoRestart=true;
function startPulseConversationFromWake(){pulseConversationActive=true;pulseAutoRestart=true;showReply('I’m listening. Go ahead.');startPulseListening(true)}
function startPulseListening(automatic=false){if(!window.AuroraOverlay||typeof AuroraOverlay.startVoiceInput!=='function'){showReply('Voice input is not available in this AURORA build.');return}try{const result=JSON.parse(String(AuroraOverlay.startVoiceInput()||'{}'));if(!result.started){showReply(result.message||'AURORA could not start voice input.');setPulseListening(false);return}setPulseListening(true);if(!automatic)showReply('Listening… speak now.')}catch(e){showReply('Could not start the microphone. Check AURORA microphone permission.');setPulseListening(false)}}
function togglePulseListening(){if(pulseListening){pulseConversationActive=false;pulseAutoRestart=false;try{AuroraOverlay.stopVoiceInput()}catch(e){}setPulseListening(false);return}pulseConversationActive=true;pulseAutoRestart=true;startPulseListening(false)}
function onPulseSpeechResult(transcript){setPulseListening(false);const text=String(transcript||'').trim();if(!text){if(pulseConversationActive&&pulseAutoRestart){showReply('I did not catch that. Listening again…');setTimeout(()=>startPulseListening(true),500)}else showReply('I did not catch that.');return}document.getElementById('prompt').value=text;sendPrompt(true)}
function onPulseSpeechError(message){setPulseListening(false);if(pulseConversationActive&&pulseAutoRestart){showReply('Listening paused. Reconnecting…');setTimeout(()=>startPulseListening(true),900)}else showReply(String(message||'Voice input stopped.'))}
function setCollapsed(value){const collapsed=!!value;document.querySelector(".shell")?.classList.toggle("collapsed",collapsed);document.body.classList.toggle("collapsed",collapsed);try{if(window.AuroraOverlay&&AuroraOverlay.setPanelCollapsed)AuroraOverlay.setPanelCollapsed(collapsed)}catch(e){}}\nfunction hidePanel(){pulseConversationActive=false;pulseAutoRestart=false;setPulseListening(false);try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}if(window.AuroraOverlay&&AuroraOverlay.hidePanel)AuroraOverlay.hidePanel()}function toggleTools(){document.getElementById('cards').classList.toggle('open')}function toggleSettings(){document.getElementById('settings').classList.toggle('open')}function setOpacity(v){document.documentElement.style.setProperty('--glass-alpha',String(Number(v)/100));document.getElementById('opacityValue').textContent=v+'%';try{localStorage.setItem('aurora-pulse-opacity',v)}catch(e){}}try{const v=localStorage.getItem('aurora-pulse-opacity');if(v){document.getElementById('opacity').value=v;setOpacity(v)}}catch(e){}
    async function tryHandleNativeAppCommand(text) {
      const cleaned = String(text || '').trim().replace(/[.!?]+$/, '').replace(/\s+/g, ' ');
      const match = cleaned.match(/^(?:please\s+)?(?:aurora\s+)?(?:open|launch|start|go to|switch to)\s+(?:my\s+|the\s+)?(.+)$/i);
      if (!match) return null;

      const requested = match[1].trim().replace(/\s+(?:app|application)$/i, '').trim();
      if (!requested) return { handled: true, reply: 'Which app would you like me to open?' };

      if (!window.AuroraOverlay ||
          typeof window.AuroraOverlay.getInstalledApps !== 'function' ||
          typeof window.AuroraOverlay.openApp !== 'function') {
        return { handled: true, reply: 'Native app launching is not available in this overlay build yet.' };
      }

      const aliases = {
        whatsapp: ['whatsapp', 'whats app', "what's app", 'wa'],
        whatsappbusiness: ['whatsapp business', 'whats app business', "what's app business", 'business whatsapp', 'wa business'],
        contacts: ['contacts', 'contact', 'my contacts', 'address book', 'people'],
        phone: ['phone', 'dialer', 'telephone', 'calling app'],
        messages: ['messages', 'messaging', 'text messages', 'sms'],
        camera: ['camera'],
        gallery: ['gallery', 'photos', 'my pictures', 'pictures'],
        settings: ['settings', 'phone settings', 'system settings'],
        calculator: ['calculator'],
        clock: ['clock', 'alarm', 'timer'],
        files: ['files', 'file manager', 'my files', 'downloads'],
        chrome: ['chrome', 'google chrome'],
        maps: ['maps', 'google maps', 'navigation']
      };

      const packageHints = {
        whatsapp: ['com.whatsapp'],
        whatsappbusiness: ['com.whatsapp.w4b']
      };

      const wanted = normalizeAppName(requested);
      const key = Object.keys(aliases).find(aliasKey =>
        aliases[aliasKey].some(alias => normalizeAppName(alias) === wanted)
      );
      const targets = key ? aliases[key].map(normalizeAppName) : [wanted];
      const packages = key ? (packageHints[key] || []).map(normalizeAppName) : [];

      let apps;
      try {
        const raw = window.AuroraOverlay.getInstalledApps();
        apps = JSON.parse(String(raw || '[]'));
      } catch {
        return { handled: true, reply: 'I could not read the phone’s installed-app list. Please try again.' };
      }

      if (!Array.isArray(apps)) apps = [];
      const matches = apps.filter(app => {
        if (!app || !app.name || !app.packageName) return false;
        const name = normalizeAppName(app.name);
        const pkg = normalizeAppName(app.packageName);
        return targets.includes(name) || packages.includes(pkg) ||
          (!key && pkg === wanted);
      });

      const unique = [...new Map(matches.map(app => [app.packageName, app])).values()];

      if (!unique.length) {
        const displayName = key === 'whatsappbusiness' ? 'WhatsApp Business' :
          key === 'whatsapp' ? 'WhatsApp' : requested;
        return { handled: true, reply: 'I could not find an installed, launchable app matching ' + displayName + '. I have not opened a different app instead.' };
      }

      if (unique.length > 1) {
        return { handled: true, reply: 'I found multiple matching apps: ' +
          unique.slice(0, 6).map(app => app.name).join(', ') +
          '. Please specify which one you want.' };
      }

      try {
        const rawResult = window.AuroraOverlay.openApp(unique[0].packageName);
        const result = JSON.parse(String(rawResult || '{}'));
        return {
          handled: true,
          reply: result.opened ? ('Opening ' + (result.appName || unique[0].name) + '.') :
            (result.message || ('Android could not open ' + unique[0].name + '.'))
        };
      } catch {
        return { handled: true, reply: 'Android could not confirm that ' + unique[0].name + ' opened.' };
      }
    }

  
  // AURORA Pulse adapter: uses the same deployed search and weather APIs as the main app.
  // GPS and on-device memory remain unavailable here until an explicit native bridge is added.
  async function getOverlayToolContext(text) {
    const apiBase = 'https://aurora-ten-gold.vercel.app';
    const userText = String(text || '').trim();

    const searchMatch = /\b(search (?:the web )?for|look up|find online|search online|latest news|news today|what's happening in|what is happening in)\b/i.test(userText);
    if (searchMatch) {
      const query = userText.replace(/^\s*(?:aurora[, ]*)?(?:please\s+)?(?:search (?:the web )?for|look up|find online|search online)\s*/i, '').trim() || userText;
      const response = await fetch(apiBase + '/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA web search failed.');
      const results = Array.isArray(data.results) ? data.results.slice(0, 5) : [];
      return 'Tool: web_search. Query: ' + query + '; source: ' + (data.source || 'web search') +
        '\n' + results.map((item, index) =>
          (index + 1) + '. ' + (item.title || 'Untitled result') +
          '\n' + (item.snippet || '') + '\nURL: ' + (item.url || '')
        ).join('\n\n');
    }

    const weatherMatch = /\b(weather|forecast|temperature outside|is it raining|will it rain|rain today)\b/i.test(userText);
    if (weatherMatch) {
      const match = userText.match(/\b(?:weather|forecast|temperature outside|is it raining|will it rain|rain today)\b(?:\s+(?:like\s+)?(?:in|for|at)\s+([^?.!,]+))?/i);
      let city = (match && match[1] ? match[1] : '').trim();
      if (/^(here|my location|where i am|outside|today|now)$/i.test(city)) city = '';
      city = city.replace(/\b(today|tomorrow|right now|now)\b.*$/i, '').trim();
      if (!city) {
        throw new Error('Please name a city or town for the weather report, for example: “Weather in Benin City.” Pulse does not yet share the main app’s GPS-location tool.');
      }
      const response = await fetch(apiBase + '/api/weather?city=' + encodeURIComponent(city));
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA weather lookup failed.');
      return 'Tool: live_weather. Verified API result: ' + JSON.stringify(data);
    }

    const mapsMatch = /\b(directions to|route to|navigate to|how do i get to|take me to|show (?:me )?(?:the )?map|open (?:google )?maps|satellite view|street view|where is|map of)\b/i.test(userText);
    if (mapsMatch) {
      const match = userText.match(/\b(?:directions to|route to|navigate to|how do i get to|take me to|map of|where is)\s+(.+?)(?:\s+(?:today|tomorrow|this morning|this afternoon|tonight|now|later|next week)\b|[?.!,]|$)/i);
      const destination = match && match[1] ? match[1].trim() : '';
      if (/\b(where am i|my current location|current location|my position)\b/i.test(userText)) {
        throw new Error('Pulse does not yet have the main app’s GPS-location bridge. You can still open Google Maps and use its location permission.');
      }
      const mapUrl = destination
        ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(destination)
        : 'https://www.google.com/maps';
      const directionsUrl = destination
        ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destination)
        : mapUrl;
      return 'Tool: maps_navigation. Give the user these direct links:\nMap: ' + mapUrl + '\nDirections: ' + directionsUrl;
    }

    return '';
  }


function speakPulseReply(text){if(!pulseConversationActive||!pulseAutoRestart){return}if(!('speechSynthesis'in window)){showReply(text+' (Spoken replies are unavailable on this device.)');setTimeout(()=>startPulseListening(true),700);return}try{window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(String(text||''));utterance.lang='en-GB';utterance.rate=1;utterance.pitch=1;utterance.onstart=()=>setOrbState('speaking');utterance.onend=()=>{if(pulseConversationActive&&pulseAutoRestart){setOrbState('listening');setTimeout(()=>startPulseListening(true),350)}};utterance.onerror=()=>{if(pulseConversationActive&&pulseAutoRestart)setTimeout(()=>startPulseListening(true),700)};window.speechSynthesis.speak(utterance)}catch(e){if(pulseConversationActive)setTimeout(()=>startPulseListening(true),700)}}
function setOrbState(state){try{if(window.AuroraOverlay&&AuroraOverlay.setOrbState)AuroraOverlay.setOrbState(state)}catch(e){}}
function showInstalledApps(){const list=document.getElementById('appList');list.innerHTML='';list.classList.add('open');let apps=[];try{apps=JSON.parse(AuroraOverlay.getInstalledApps()||'[]')}catch(e){}if(!apps.length){showReply('No launchable apps were returned by Android.');return}apps.sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,30).forEach(app=>{const b=document.createElement('button');b.className='app-item';b.textContent=app.name;b.onclick=()=>{try{const r=JSON.parse(AuroraOverlay.openApp(app.packageName)||'{}');showReply(r.message||('Opening '+app.name));list.classList.remove('open')}catch(e){showReply('Android could not open '+app.name)}};list.appendChild(b)});showReply('Choose an installed app to open.')}
function showReply(t){const e=document.getElementById('reply');e.style.display='block';e.textContent=t}
function hideToolPanels(){document.getElementById('appList').classList.remove('open');document.getElementById('taskPanel').classList.remove('open')}
function loadTasks(){let a=[];try{a=JSON.parse(localStorage.getItem('aurora-pulse-tasks')||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function renderTasks(){const root=document.getElementById('taskRows');root.innerHTML='';const tasks=loadTasks();if(!tasks.length){root.textContent='No tasks yet. Add your first task below.';return}tasks.forEach((t,i)=>{const row=document.createElement('label');row.className='task-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.onchange=()=>{const a=loadTasks();a[i].done=cb.checked;localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));renderTasks()};const span=document.createElement('span');span.textContent=t.text;span.style.textDecoration=t.done?'line-through':'none';row.append(cb,span);root.appendChild(row)})}
function addTask(){const input=document.getElementById('taskInput'),value=input.value.trim();if(!value)return;const a=loadTasks();a.push({text:value,done:false,createdAt:Date.now()});localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));input.value='';renderTasks()}
async function tool(n){const p=document.getElementById('prompt');document.getElementById('cards').classList.remove('open');hideToolPanels();if(n==='Open Apps'){showInstalledApps();return}if(n==='Tasks'){document.getElementById('taskPanel').classList.add('open');renderTasks();return}if(n==='Calendar'){try{const r=JSON.parse(AuroraOverlay.openCalendar()||'{}');showReply(r.message||'Opening your calendar.')}catch(e){showReply('Could not open your calendar app.')}return}if(n==='Email'){try{const r=JSON.parse(AuroraOverlay.composeEmail()||'{}');showReply(r.message||'Opening your email app.')}catch(e){showReply('Could not open your email app.')}return}const q={'Weather':'What is the weather?','More tools':'Show me more tools'};p.value=q[n]||n;sendPrompt()}
async function sendPrompt(fromVoice=false){if(pulseListening){try{AuroraOverlay.stopVoiceInput()}catch(e){}setPulseListening(false)}const p=document.getElementById('prompt'),t=p.value.trim();if(!t)return;setOrbState('thinking');showReply('AURORA is thinking…');document.querySelector('.send').disabled=true;try{const nativeAction=await tryHandleNativeAppCommand(t);if(nativeAction&&nativeAction.handled){addPulseMessage('user',t);addPulseMessage('assistant',nativeAction.reply);showReply(nativeAction.reply);setOrbState('speaking');p.value='';if(fromVoice)speakPulseReply(nativeAction.reply);return}const toolContext=await getOverlayToolContext(t);addPulseMessage('user',t);const r=await fetch('https://aurora-ten-gold.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:pulseSession.slice(-12),profile:loadPulseProfile(),toolContext})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch(e){}if(!r.ok)throw new Error(d.error||('Chat API HTTP '+r.status));const reply=String(d.reply||'AURORA returned an empty response.');addPulseMessage('assistant',reply);showReply(reply);setOrbState('speaking');p.value='';if(fromVoice) speakPulseReply(reply)}catch(e){const message=e.message||'Could not reach AURORA.';addPulseMessage('assistant',message);showReply(message);setOrbState('idle');if(fromVoice&&pulseConversationActive)setTimeout(()=>startPulseListening(true),1200)}finally{document.querySelector('.send').disabled=false;setTimeout(()=>{if(!pulseConversationActive)setOrbState('idle')},3500)}}if(pulseSession.length){const last=pulseSession.slice(-6).map(m=>(m.role==='user'?'You: ':'AURORA: ')+m.content).join('\n\n');showReply(last)}
document.getElementById('prompt').addEventListener('focus',()=>setOrbState('listening'));document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendPrompt()}});
</script></body></html>
