<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--glass-alpha:.12;--ink:#f5f0ff;--muted:#c3b8d9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font:13px system-ui,-apple-system,Segoe UI,sans-serif}
.shell{position:relative;height:100%;width:100%;padding:10px;border:1px solid transparent;border-radius:24px;background:linear-gradient(rgba(12,14,28,var(--glass-alpha)),rgba(15,14,31,calc(var(--glass-alpha)*.8))) padding-box,conic-gradient(from 20deg,#ff70ce,#ffd36e,#75f0c7,#61cfff,#bd91ff,#ff70ce) border-box;box-shadow:0 8px 26px #0002;display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:center;gap:8px;min-height:29px}.drag-handle{display:flex;align-items:center;gap:7px;min-width:0;flex:1;touch-action:none;user-select:none;cursor:grab;color:#e9d8ff}.drag-handle:active{cursor:grabbing}.grip{font-size:16px;opacity:.7}.brand{font-size:10px;font-weight:800;letter-spacing:.16em}.status{font-size:9px;color:#a9f5d7;letter-spacing:.1em}.top-spacer{flex:1}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.tools,.close,.settings-button{display:grid;place-items:center;flex:none;width:31px;height:31px;border:1px solid transparent;border-radius:50%;color:#f6eaff;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.025)) padding-box,conic-gradient(#ff70ce,#ffd36e,#75f0c7,#61cfff,#bd91ff,#ff70ce) border-box}.tools{font-size:16px}.close{font-size:18px}.settings-button{font-size:14px}
.conversation{display:flex;flex:1;flex-direction:column;gap:8px;min-height:66px;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 7px;scrollbar-width:thin;scrollbar-color:#b88aff55 transparent}
.message{max-width:92%;padding:9px 11px;border:1px solid transparent;border-radius:15px;background:linear-gradient(rgba(18,18,39,.14),rgba(18,18,39,.10)) padding-box,conic-gradient(from 30deg,rgba(255,112,206,.72),rgba(255,211,110,.5),rgba(117,240,199,.48),rgba(97,207,255,.62),rgba(189,145,255,.7),rgba(255,112,206,.72)) border-box;overflow-wrap:anywhere;animation:messageIn .28s ease both}
.message.user{align-self:flex-end;background:linear-gradient(rgba(62,39,82,.2),rgba(31,28,57,.14)) padding-box,conic-gradient(from 20deg,#ff70ceaa,#61cfffaa,#bd91ffaa,#ff70ceaa) border-box}
.message.assistant{align-self:flex-start}.message-label{margin-bottom:4px;color:#e4c6ff;font-size:9px;font-weight:750;letter-spacing:.1em}.message-text{color:#f8f4ff;font-size:12px;line-height:1.48;white-space:pre-wrap}.message.thinking .message-text{min-height:20px}
.thinking-dots{display:flex;align-items:center;gap:5px;color:#e3d3ff}.thinking-dots i{width:5px;height:5px;border-radius:50%;background:#caa0ff;box-shadow:0 0 9px #caa0ff;animation:think .85s ease-in-out infinite}.thinking-dots i:nth-child(2){animation-delay:.14s}.thinking-dots i:nth-child(3){animation-delay:.28s}.thinking-dots small{margin-left:4px;font-size:10px}
.composer{display:flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border:1px solid transparent;border-radius:999px;background:linear-gradient(rgba(20,18,39,.16),rgba(20,18,39,.12)) padding-box,conic-gradient(#ff70ceaa,#61cfffaa,#bd91ffaa,#ff70ceaa) border-box}
input[type=text]{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:13px system-ui}.composer input::placeholder{color:#d4c9e5aa}
.send{display:grid;place-items:center;flex:none;width:34px;height:34px;border:1px solid #d8b7ff66;border-radius:50%;background:rgba(170,125,255,.16);color:#fff;font-size:16px}.send:disabled{opacity:.4}
.cards{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:190px;overflow:auto;padding:2px}.cards.open{display:grid}
.card{position:relative;min-height:62px;padding:8px;border:1px solid transparent;border-radius:14px;background:linear-gradient(rgba(255,255,255,.045),rgba(255,255,255,.015)) padding-box,conic-gradient(from 0deg,rgba(255,112,206,.72),rgba(255,211,110,.48),rgba(117,240,199,.45),rgba(97,207,255,.62),rgba(189,145,255,.72),rgba(255,112,206,.72)) border-box;color:#f7efff;font-size:10px;display:flex;align-items:center;gap:9px;text-align:left}.card b{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.055);color:#e5c7ff;font-size:15px;font-weight:500}
.app-list{display:none;max-height:115px;overflow:auto;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px}.app-list.open{display:grid}.app-item{padding:8px 7px;border:1px solid #ffffff24;border-radius:10px;background:#ffffff0b;color:#edf4ff;font-size:10px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-panel{display:none;max-height:110px;overflow:auto;padding:7px;border:1px solid #ffffff22;border-radius:12px;background:#ffffff08;color:#edf4ff}.task-panel.open{display:block}.task-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:10px}.task-row input{accent-color:#bd91ff}.task-add{display:flex;gap:6px;margin-top:6px}.task-add input{padding:6px;border-radius:8px;background:#ffffff12}.task-add button{border:0;border-radius:8px;background:#8e72d8;color:white;padding:0 9px}
.settings{display:none;align-items:center;gap:7px;padding:3px 2px;color:#d2c4e6;font-size:9px}.settings.open{display:flex}.settings input{flex:1;min-width:0;accent-color:#bd91ff}
.footer{display:flex;align-items:center;justify-content:space-between;color:#d7c7ee88;font-size:8px;letter-spacing:.12em}
@keyframes messageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes think{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
</style></head><body>
<main class="shell">
  <header class="top">
    <div id="dragHandle" class="drag-handle"><span class="grip">⠿</span><span class="brand">AURORA PULSE</span></div>
    <span class="status">● READY</span>
    <button class="tools" onclick="toggleTools()" aria-label="Open tools">⌘</button>
    <button class="settings-button" onclick="toggleSettings()" aria-label="Glass transparency">◉</button>
    <button class="close" aria-label="Close panel" onclick="hidePanel()">×</button>
  </header>
  <section id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions text"></section>
  <div id="cards" class="cards">
    <button class="card" onclick="tool('Weather')"><b>☼</b>Weather</button>
    <button class="card" onclick="tool('Calendar')"><b>▦</b>Calendar</button>
    <button class="card" onclick="tool('Tasks')"><b>✓</b>Tasks</button>
    <button class="card" onclick="tool('Email')"><b>✉</b>Email</button>
    <button class="card" onclick="tool('Open Apps')"><b>▣</b>Apps</button>
    <button class="card" onclick="tool('Camera')"><b>◉</b>Camera</button>
    <button class="card" onclick="tool('Files')"><b>▤</b>Files</button>
    <button class="card" onclick="tool('Writing')"><b>✎</b>Writing</button>
    <button class="card" onclick="tool('Translate')"><b>文</b>Translate</button>
    <button class="card" onclick="tool('More tools')"><b>✧</b>More tools</button>
  </div>
  <div id="appList" class="app-list"></div>
  <section id="taskPanel" class="task-panel"><div id="taskRows"></div><div class="task-add"><input id="taskInput" type="text" placeholder="Add a task…"><button onclick="addTask()">Add</button></div></section>
  <div id="settings" class="settings"><span>Transparency</span><input id="opacity" type="range" min="35" max="95" step="5" value="78" oninput="setOpacity(this.value)"><span id="opacityValue">78%</span></div>
  <div class="composer"><input id="prompt" type="text" placeholder="Message AURORA…" autocomplete="off" aria-label="Message AURORA"><button class="send" onclick="sendPrompt()" aria-label="Send">➤</button></div>
  <div class="footer"><span>BACKGROUND UNTOUCHED</span><span>DRAG THE TOP HANDLE TO MOVE</span></div>
</main><script>
let pendingAssistantBubble=null;let isSending=false;
function hidePanel(){if(window.AuroraOverlay&&AuroraOverlay.hidePanel)AuroraOverlay.hidePanel()}
function toggleTools(){document.getElementById('cards').classList.toggle('open')}
function toggleSettings(){document.getElementById('settings').classList.toggle('open')}
function setOpacity(v){const transparency=Number(v);document.documentElement.style.setProperty('--glass-alpha',String((100-transparency)/100*.55));document.getElementById('opacityValue').textContent=transparency+'%';try{localStorage.setItem('aurora-pulse-opacity',v)}catch(e){}}
try{const v=localStorage.getItem('aurora-pulse-opacity');if(v){document.getElementById('opacity').value=v;setOpacity(v)}else setOpacity(78)}catch(e){setOpacity(78)}
function scrollConversation(){const root=document.getElementById('conversation');if(root)root.scrollTop=root.scrollHeight}
function appendMessage(role){const root=document.getElementById('conversation');const bubble=document.createElement('article');bubble.className='message '+role;if(role==='assistant'){const label=document.createElement('div');label.className='message-label';label.textContent='✧ AURORA';bubble.appendChild(label)}const text=document.createElement('div');text.className='message-text';bubble.appendChild(text);root.appendChild(bubble);scrollConversation();return bubble}
function animateMessageText(target,value){const text=String(value||'');target.textContent='';let index=0;const timer=setInterval(()=>{index=Math.min(text.length,index+(index<60?1:2));target.textContent=text.slice(0,index);scrollConversation();if(index>=text.length)clearInterval(timer)},40)}
function beginAssistantThinking(){pendingAssistantBubble=appendMessage('assistant');pendingAssistantBubble.classList.add('thinking');pendingAssistantBubble.querySelector('.message-text').innerHTML='<span class="thinking-dots"><i></i><i></i><i></i><small>Thinking</small></span>'}

    async function tryHandleNativeAppCommand(text) {
      const cleaned = String(text || '').trim().replace(/[.!?]+$/, '').replace(/\s+/g, ' ');
      const match = cleaned.match(/^(?:please\s+)?(?:aurora\s+)?(?:open|launch|start|go to|switch to)\s+(?:my\s+|the\s+)?(.+)$/i);
      if (!match) return null;

      const requested = match[1].trim().replace(/\s+(?:app|application)$/i, '').trim();
      if (!requested) return { handled: true, reply: 'Which app would you like me to open?' };

      if (!window.AuroraOverlay ||
          typeof window.AuroraOverlay.getInstalledApps !== 'function' ||
          typeof window.AuroraOverlay.openApp !== 'function') {
        return { handled: true, reply: 'Native app launching is not available in this overlay build yet.' };
      }

      const aliases = {
        whatsapp: ['whatsapp', 'whats app', "what's app", 'wa'],
        whatsappbusiness: ['whatsapp business', 'whats app business', "what's app business", 'business whatsapp', 'wa business'],
        contacts: ['contacts', 'contact', 'my contacts', 'address book', 'people'],
        phone: ['phone', 'dialer', 'telephone', 'calling app'],
        messages: ['messages', 'messaging', 'text messages', 'sms'],
        camera: ['camera'],
        gallery: ['gallery', 'photos', 'my pictures', 'pictures'],
        settings: ['settings', 'phone settings', 'system settings'],
        calculator: ['calculator'],
        clock: ['clock', 'alarm', 'timer'],
        files: ['files', 'file manager', 'my files', 'downloads'],
        chrome: ['chrome', 'google chrome'],
        maps: ['maps', 'google maps', 'navigation']
      };

      const packageHints = {
        whatsapp: ['com.whatsapp'],
        whatsappbusiness: ['com.whatsapp.w4b']
      };

      const wanted = normalizeAppName(requested);
      const key = Object.keys(aliases).find(aliasKey =>
        aliases[aliasKey].some(alias => normalizeAppName(alias) === wanted)
      );
      const targets = key ? aliases[key].map(normalizeAppName) : [wanted];
      const packages = key ? (packageHints[key] || []).map(normalizeAppName) : [];

      let apps;
      try {
        const raw = window.AuroraOverlay.getInstalledApps();
        apps = JSON.parse(String(raw || '[]'));
      } catch {
        return { handled: true, reply: 'I could not read the phoneÃ¢â‚¬â„¢s installed-app list. Please try again.' };
      }

      if (!Array.isArray(apps)) apps = [];
      const matches = apps.filter(app => {
        if (!app || !app.name || !app.packageName) return false;
        const name = normalizeAppName(app.name);
        const pkg = normalizeAppName(app.packageName);
        return targets.includes(name) || packages.includes(pkg) ||
          (!key && pkg === wanted);
      });

      const unique = [...new Map(matches.map(app => [app.packageName, app])).values()];

      if (!unique.length) {
        const displayName = key === 'whatsappbusiness' ? 'WhatsApp Business' :
          key === 'whatsapp' ? 'WhatsApp' : requested;
        return { handled: true, reply: 'I could not find an installed, launchable app matching ' + displayName + '. I have not opened a different app instead.' };
      }

      if (unique.length > 1) {
        return { handled: true, reply: 'I found multiple matching apps: ' +
          unique.slice(0, 6).map(app => app.name).join(', ') +
          '. Please specify which one you want.' };
      }

      try {
        const rawResult = window.AuroraOverlay.openApp(unique[0].packageName);
        const result = JSON.parse(String(rawResult || '{}'));
        return {
          handled: true,
          reply: result.opened ? ('Opening ' + (result.appName || unique[0].name) + '.') :
            (result.message || ('Android could not open ' + unique[0].name + '.'))
        };
      } catch {
        return { handled: true, reply: 'Android could not confirm that ' + unique[0].name + ' opened.' };
      }
    }

  
  // AURORA Pulse adapter: uses the same deployed search and weather APIs as the main app.
  // GPS and on-device memory remain unavailable here until an explicit native bridge is added.
  async function getOverlayToolContext(text) {
    const apiBase = 'https://aurora-ten-gold.vercel.app';
    const userText = String(text || '').trim();

    const searchMatch = /\b(search (?:the web )?for|look up|find online|search online|latest news|news today|what's happening in|what is happening in)\b/i.test(userText);
    if (searchMatch) {
      const query = userText.replace(/^\s*(?:aurora[, ]*)?(?:please\s+)?(?:search (?:the web )?for|look up|find online|search online)\s*/i, '').trim() || userText;
      const response = await fetch(apiBase + '/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA web search failed.');
      const results = Array.isArray(data.results) ? data.results.slice(0, 5) : [];
      return 'Tool: web_search. Query: ' + query + '; source: ' + (data.source || 'web search') +
        '\n' + results.map((item, index) =>
          (index + 1) + '. ' + (item.title || 'Untitled result') +
          '\n' + (item.snippet || '') + '\nURL: ' + (item.url || '')
        ).join('\n\n');
    }

    const weatherMatch = /\b(weather|forecast|temperature outside|is it raining|will it rain|rain today)\b/i.test(userText);
    if (weatherMatch) {
      const match = userText.match(/\b(?:weather|forecast|temperature outside|is it raining|will it rain|rain today)\b(?:\s+(?:like\s+)?(?:in|for|at)\s+([^?.!,]+))?/i);
      let city = (match && match[1] ? match[1] : '').trim();
      if (/^(here|my location|where i am|outside|today|now)$/i.test(city)) city = '';
      city = city.replace(/\b(today|tomorrow|right now|now)\b.*$/i, '').trim();
      if (!city) {
        throw new Error('Please name a city or town for the weather report, for example: Ã¢â‚¬Å“Weather in Benin City.Ã¢â‚¬Â Pulse does not yet share the main appÃ¢â‚¬â„¢s GPS-location tool.');
      }
      const response = await fetch(apiBase + '/api/weather?city=' + encodeURIComponent(city));
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA weather lookup failed.');
      return 'Tool: live_weather. Verified API result: ' + JSON.stringify(data);
    }

    const mapsMatch = /\b(directions to|route to|navigate to|how do i get to|take me to|show (?:me )?(?:the )?map|open (?:google )?maps|satellite view|street view|where is|map of)\b/i.test(userText);
    if (mapsMatch) {
      const match = userText.match(/\b(?:directions to|route to|navigate to|how do i get to|take me to|map of|where is)\s+(.+?)(?:\s+(?:today|tomorrow|this morning|this afternoon|tonight|now|later|next week)\b|[?.!,]|$)/i);
      const destination = match && match[1] ? match[1].trim() : '';
      if (/\b(where am i|my current location|current location|my position)\b/i.test(userText)) {
        throw new Error('Pulse does not yet have the main appÃ¢â‚¬â„¢s GPS-location bridge. You can still open Google Maps and use its location permission.');
      }
      const mapUrl = destination
        ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(destination)
        : 'https://www.google.com/maps';
      const directionsUrl = destination
        ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destination)
        : mapUrl;
      return 'Tool: maps_navigation. Give the user these direct links:\nMap: ' + mapUrl + '\nDirections: ' + directionsUrl;
    }

    return '';
  }


function setOrbState(state){try{if(window.AuroraOverlay&&AuroraOverlay.setOrbState)AuroraOverlay.setOrbState(state)}catch(e){}}
function showInstalledApps(){const list=document.getElementById('appList');list.innerHTML='';list.classList.add('open');let apps=[];try{apps=JSON.parse(AuroraOverlay.getInstalledApps()||'[]')}catch(e){}if(!apps.length){showReply('No launchable apps were returned by Android.');return}apps.sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,30).forEach(app=>{const b=document.createElement('button');b.className='app-item';b.textContent=app.name;b.onclick=()=>{try{const r=JSON.parse(AuroraOverlay.openApp(app.packageName)||'{}');showReply(r.message||('Opening '+app.name));list.classList.remove('open')}catch(e){showReply('Android could not open '+app.name)}};list.appendChild(b)});showReply('Choose an installed app to open.')}
function showReply(t){let bubble=pendingAssistantBubble;if(!bubble)bubble=appendMessage('assistant');pendingAssistantBubble=null;bubble.classList.remove('thinking');const target=bubble.querySelector('.message-text');animateMessageText(target,t)}
function hideToolPanels(){document.getElementById('appList').classList.remove('open');document.getElementById('taskPanel').classList.remove('open')}
function loadTasks(){let a=[];try{a=JSON.parse(localStorage.getItem('aurora-pulse-tasks')||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function renderTasks(){const root=document.getElementById('taskRows');root.innerHTML='';const tasks=loadTasks();if(!tasks.length){root.textContent='No tasks yet. Add your first task below.';return}tasks.forEach((t,i)=>{const row=document.createElement('label');row.className='task-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.onchange=()=>{const a=loadTasks();a[i].done=cb.checked;localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));renderTasks()};const span=document.createElement('span');span.textContent=t.text;span.style.textDecoration=t.done?'line-through':'none';row.append(cb,span);root.appendChild(row)})}
function addTask(){const input=document.getElementById('taskInput'),value=input.value.trim();if(!value)return;const a=loadTasks();a.push({text:value,done:false,createdAt:Date.now()});localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));input.value='';renderTasks()}
async function tool(n){const p=document.getElementById('prompt');document.getElementById('cards').classList.remove('open');hideToolPanels();if(n==='Open Apps'){showInstalledApps();return}if(n==='Tasks'){document.getElementById('taskPanel').classList.add('open');renderTasks();return}if(n==='Calendar'){try{const r=JSON.parse(AuroraOverlay.openCalendar()||'{}');showReply(r.message||'Opening your calendar.')}catch(e){showReply('Could not open your calendar app.')}return}if(n==='Email'){try{const r=JSON.parse(AuroraOverlay.composeEmail()||'{}');showReply(r.message||'Opening your email app.')}catch(e){showReply('Could not open your email app.')}return}const q={'Weather':'What is the weather?','More tools':'Show me more tools'};p.value=q[n]||n;sendPrompt()}
async function sendPrompt(){const p=document.getElementById('prompt'),t=p.value.trim();if(!t||isSending)return;isSending=true;appendMessage('user').querySelector('.message-text').textContent=t;beginAssistantThinking();setOrbState('thinking');document.querySelector('.send').disabled=true;try{const nativeAction=await tryHandleNativeAppCommand(t);if(nativeAction&&nativeAction.handled){showReply(nativeAction.reply);setOrbState('speaking');p.value='';return}const toolContext=await getOverlayToolContext(t);const r=await fetch('https://aurora-ten-gold.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}],profile:{},toolContext})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch(e){}if(!r.ok)throw new Error(d.error||('Chat API HTTP '+r.status));showReply(String(d.reply||'AURORA returned an empty response.'));setOrbState('speaking');p.value=''}catch(e){showReply(e.message||'Could not reach AURORA.');setOrbState('idle')}finally{isSending=false;document.querySelector('.send').disabled=false;setTimeout(()=>setOrbState('idle'),3500)}}document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendPrompt()}});
const dragHandle=document.getElementById('dragHandle');let dragPoint=null;
dragHandle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragPoint={x:e.clientX,y:e.clientY};dragHandle.setPointerCapture(e.pointerId);e.preventDefault()});
dragHandle.addEventListener('pointermove',e=>{if(!dragPoint)return;const dx=e.clientX-dragPoint.x,dy=e.clientY-dragPoint.y;dragPoint={x:e.clientX,y:e.clientY};if(window.AuroraOverlay&&AuroraOverlay.movePanelBy)AuroraOverlay.movePanelBy(Math.round(dx),Math.round(dy))});
const stopDrag=()=>{dragPoint=null};dragHandle.addEventListener('pointerup',stopDrag);dragHandle.addEventListener('pointercancel',stopDrag);dragHandle.addEventListener('lostpointercapture',stopDrag);
appendMessage('assistant').querySelector('.message-text').textContent='Hello. I am here whenever you need me.';
</script></body></html>
