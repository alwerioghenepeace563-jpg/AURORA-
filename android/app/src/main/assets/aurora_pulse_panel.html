<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--glass-alpha:.64;--ink:#edf4ff;--muted:#9eabc0;--cyan:#62e8f4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.shell{height:100%;padding:12px;border:1px solid transparent;border-radius:25px;background:linear-gradient(rgba(10,16,32,var(--glass-alpha)),rgba(10,16,32,var(--glass-alpha))) padding-box,conic-gradient(from var(--pulse-angle),#ff72c8,#b58aff,#62dcff,#6df0c8,#ffe38a,#ff72c8) border-box;backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);box-shadow:0 14px 44px #0005,0 0 18px #9c78ff30,inset 0 1px #ffffff18;display:flex;flex-direction:column;gap:9px;animation:pulseBorder 9s linear infinite}@property --pulse-angle{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes pulseBorder{to{--pulse-angle:360deg}}.top{display:flex;align-items:center;gap:8px}.brand{font-weight:800;letter-spacing:.12em;font-size:12px}.status{margin-left:auto;color:#6ce6bd;font-size:10px}.close{border:0;background:#ffffff12;color:#fff;border-radius:50%;width:28px;height:28px;font-size:17px}.reply{display:none;max-height:156px;overflow:auto;padding:2px 1px;border-radius:13px;color:#e8efff;font-size:12px;line-height:1.45;white-space:pre-wrap;display:flex;flex-direction:column;gap:7px}.message{max-width:94%;padding:9px 11px;border:1px solid #ffffff1d;border-radius:15px;background:linear-gradient(135deg,#ffffff13,#ffffff08);box-shadow:inset 0 0 0 1px #a68cff12,0 0 12px #61dff012;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;border-color:#69dff055;background:linear-gradient(135deg,#4acbe52b,#9875f42b)}.message.assistant{align-self:flex-start;border-color:#d09bff55}.message.thinking{color:#b9c8df}.thinking-dots:after{content:'…';display:inline-block;overflow:hidden;vertical-align:bottom;animation:dots 1s steps(4,end) infinite;width:0}@keyframes dots{to{width:1.2em}}.drag-grip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;color:#aeb9d0;font-size:18px;cursor:grab;touch-action:none;user-select:none}.top{touch-action:pan-y}.top .brand{cursor:grab}.composer{display:flex;align-items:center;gap:8px;margin-top:auto;padding:8px 9px;border-radius:17px;background:#ffffff12;border:1px solid #ffffff20}input[type=text]{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:14px system-ui}input::placeholder{color:#a9b5c8}.send,.tools{border:0;color:#fff;background:linear-gradient(135deg,#27cde6,#8161ed);border-radius:50%;width:36px;height:36px;font-size:16px}.bottom{display:flex;align-items:center;justify-content:space-between}.hint{font-size:9px;letter-spacing:.12em;color:#9aa9c2}.tools{width:34px;height:34px;background:#ffffff16;border:1px solid #ffffff26;color:#d7d1ff}.cards{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px;border-radius:15px;background:#080e1dcc;border:1px solid #ffffff1c}.cards.open{display:grid}.card{min-height:55px;border:1px solid #ffffff1b;border-radius:12px;background:#ffffff0b;color:#eaf1ff;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.card b{font-size:17px;font-weight:500;color:var(--cyan)}.app-list{display:none;max-height:112px;overflow:auto;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px;border-radius:13px;background:#080e1dcc}.app-list.open{display:grid}.task-panel{display:none;max-height:116px;overflow:auto;padding:8px;border-radius:13px;background:#080e1dcc;color:#edf4ff}.task-panel.open{display:block}.task-row{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11px}.task-row input{accent-color:#8d78ff}.task-add{display:flex;gap:6px;margin-top:6px}.task-add input{min-width:0;padding:7px;border-radius:8px;background:#ffffff12}.task-add button{border:0;border-radius:8px;background:#6b61d9;color:white;padding:0 10px}.app-item{padding:9px 7px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0c;color:#edf4ff;font-size:11px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.settings{display:none;align-items:center;gap:8px;padding:4px 2px;color:#aebbd0;font-size:10px}.settings.open{display:flex}.settings input{accent-color:#8d78ff}
</style></head><body><main class="shell"><div class="top"><span class="drag-grip" aria-label="Move AURORA chat panel">⠿</span><span style="font-size:17px;color:#71e5f5">✧</span><span class="brand">AURORA PULSE</span><span class="status">● READY</span><button class="close" aria-label="Close panel" onclick="hidePanel()">×</button></div><div id="reply" class="reply" role="status" aria-live="polite"></div><div id="cards" class="cards"><button class="card" onclick="tool('Weather')"><b>☼</b>Weather</button><button class="card" onclick="tool('Calendar')"><b>▦</b>Calendar</button><button class="card" onclick="tool('Tasks')"><b>✓</b>Tasks</button><button class="card" onclick="tool('Email')"><b>✉</b>Email</button><button class="card" onclick="tool('Open Apps')"><b>▦</b>Apps</button><button class="card" onclick="tool('More tools')"><b>✧</b>More</button></div><div id="appList" class="app-list"></div><section id="taskPanel" class="task-panel"><div id="taskRows"></div><div class="task-add"><input id="taskInput" type="text" placeholder="Add a task…"><button onclick="addTask()">Add</button></div></section><div id="settings" class="settings"><span>Glass opacity</span><input id="opacity" type="range" min="15" max="90" value="64" oninput="setOpacity(this.value)"><span id="opacityValue">64%</span></div><div class="composer"><input id="prompt" type="text" placeholder="Ask AURORA…" autocomplete="off" aria-label="Ask AURORA"><button class="send" onclick="sendPrompt()" aria-label="Send">➤</button></div><div class="bottom"><span class="hint">YOUR AI, OVER YOUR SCREEN</span><div style="display:flex;gap:7px"><button class="tools" onclick="toggleSettings()" aria-label="Glass settings">⚙</button><button class="tools" onclick="toggleTools()" aria-label="Open tools">▦</button></div></div></main><script>
function hidePanel(){if(window.AuroraOverlay&&AuroraOverlay.hidePanel)AuroraOverlay.hidePanel()}function toggleTools(){document.getElementById('cards').classList.toggle('open')}function toggleSettings(){document.getElementById('settings').classList.toggle('open')}function setOpacity(v){document.documentElement.style.setProperty('--glass-alpha',String(Number(v)/100));document.getElementById('opacityValue').textContent=v+'%';try{localStorage.setItem('aurora-pulse-opacity',v)}catch(e){}}try{const v=localStorage.getItem('aurora-pulse-opacity');if(v){document.getElementById('opacity').value=v;setOpacity(v)}}catch(e){}
    async function tryHandleNativeAppCommand(text) {
      const cleaned = String(text || '').trim().replace(/[.!?]+$/, '').replace(/\s+/g, ' ');
      const match = cleaned.match(/^(?:please\s+)?(?:aurora\s+)?(?:open|launch|start|go to|switch to)\s+(?:my\s+|the\s+)?(.+)$/i);
      if (!match) return null;

      const requested = match[1].trim().replace(/\s+(?:app|application)$/i, '').trim();
      if (!requested) return { handled: true, reply: 'Which app would you like me to open?' };

      if (!window.AuroraOverlay ||
          typeof window.AuroraOverlay.getInstalledApps !== 'function' ||
          typeof window.AuroraOverlay.openApp !== 'function') {
        return { handled: true, reply: 'Native app launching is not available in this overlay build yet.' };
      }

      const aliases = {
        whatsapp: ['whatsapp', 'whats app', "what's app", 'wa'],
        whatsappbusiness: ['whatsapp business', 'whats app business', "what's app business", 'business whatsapp', 'wa business'],
        contacts: ['contacts', 'contact', 'my contacts', 'address book', 'people'],
        phone: ['phone', 'dialer', 'telephone', 'calling app'],
        messages: ['messages', 'messaging', 'text messages', 'sms'],
        camera: ['camera'],
        gallery: ['gallery', 'photos', 'my pictures', 'pictures'],
        settings: ['settings', 'phone settings', 'system settings'],
        calculator: ['calculator'],
        clock: ['clock', 'alarm', 'timer'],
        files: ['files', 'file manager', 'my files', 'downloads'],
        chrome: ['chrome', 'google chrome'],
        maps: ['maps', 'google maps', 'navigation']
      };

      const packageHints = {
        whatsapp: ['com.whatsapp'],
        whatsappbusiness: ['com.whatsapp.w4b']
      };

      const wanted = normalizeAppName(requested);
      const key = Object.keys(aliases).find(aliasKey =>
        aliases[aliasKey].some(alias => normalizeAppName(alias) === wanted)
      );
      const targets = key ? aliases[key].map(normalizeAppName) : [wanted];
      const packages = key ? (packageHints[key] || []).map(normalizeAppName) : [];

      let apps;
      try {
        const raw = window.AuroraOverlay.getInstalledApps();
        apps = JSON.parse(String(raw || '[]'));
      } catch {
        return { handled: true, reply: 'I could not read the phoneÃ¢â‚¬â„¢s installed-app list. Please try again.' };
      }

      if (!Array.isArray(apps)) apps = [];
      const matches = apps.filter(app => {
        if (!app || !app.name || !app.packageName) return false;
        const name = normalizeAppName(app.name);
        const pkg = normalizeAppName(app.packageName);
        return targets.includes(name) || packages.includes(pkg) ||
          (!key && pkg === wanted);
      });

      const unique = [...new Map(matches.map(app => [app.packageName, app])).values()];

      if (!unique.length) {
        const displayName = key === 'whatsappbusiness' ? 'WhatsApp Business' :
          key === 'whatsapp' ? 'WhatsApp' : requested;
        return { handled: true, reply: 'I could not find an installed, launchable app matching ' + displayName + '. I have not opened a different app instead.' };
      }

      if (unique.length > 1) {
        return { handled: true, reply: 'I found multiple matching apps: ' +
          unique.slice(0, 6).map(app => app.name).join(', ') +
          '. Please specify which one you want.' };
      }

      try {
        const rawResult = window.AuroraOverlay.openApp(unique[0].packageName);
        const result = JSON.parse(String(rawResult || '{}'));
        return {
          handled: true,
          reply: result.opened ? ('Opening ' + (result.appName || unique[0].name) + '.') :
            (result.message || ('Android could not open ' + unique[0].name + '.'))
        };
      } catch {
        return { handled: true, reply: 'Android could not confirm that ' + unique[0].name + ' opened.' };
      }
    }

  
  // AURORA Pulse adapter: uses the same deployed search and weather APIs as the main app.
  // GPS and on-device memory remain unavailable here until an explicit native bridge is added.
  async function getOverlayToolContext(text) {
    const apiBase = 'https://aurora-ten-gold.vercel.app';
    const userText = String(text || '').trim();

    const searchMatch = /\b(search (?:the web )?for|look up|find online|search online|latest news|news today|what's happening in|what is happening in)\b/i.test(userText);
    if (searchMatch) {
      const query = userText.replace(/^\s*(?:aurora[, ]*)?(?:please\s+)?(?:search (?:the web )?for|look up|find online|search online)\s*/i, '').trim() || userText;
      const response = await fetch(apiBase + '/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA web search failed.');
      const results = Array.isArray(data.results) ? data.results.slice(0, 5) : [];
      return 'Tool: web_search. Query: ' + query + '; source: ' + (data.source || 'web search') +
        '\n' + results.map((item, index) =>
          (index + 1) + '. ' + (item.title || 'Untitled result') +
          '\n' + (item.snippet || '') + '\nURL: ' + (item.url || '')
        ).join('\n\n');
    }

    const weatherMatch = /\b(weather|forecast|temperature outside|is it raining|will it rain|rain today)\b/i.test(userText);
    if (weatherMatch) {
      const match = userText.match(/\b(?:weather|forecast|temperature outside|is it raining|will it rain|rain today)\b(?:\s+(?:like\s+)?(?:in|for|at)\s+([^?.!,]+))?/i);
      let city = (match && match[1] ? match[1] : '').trim();
      if (/^(here|my location|where i am|outside|today|now)$/i.test(city)) city = '';
      city = city.replace(/\b(today|tomorrow|right now|now)\b.*$/i, '').trim();
      if (!city) {
        throw new Error('Please name a city or town for the weather report, for example: Ã¢â‚¬Å“Weather in Benin City.Ã¢â‚¬Â Pulse does not yet share the main appÃ¢â‚¬â„¢s GPS-location tool.');
      }
      const response = await fetch(apiBase + '/api/weather?city=' + encodeURIComponent(city));
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'AURORA weather lookup failed.');
      return 'Tool: live_weather. Verified API result: ' + JSON.stringify(data);
    }

    const mapsMatch = /\b(directions to|route to|navigate to|how do i get to|take me to|show (?:me )?(?:the )?map|open (?:google )?maps|satellite view|street view|where is|map of)\b/i.test(userText);
    if (mapsMatch) {
      const match = userText.match(/\b(?:directions to|route to|navigate to|how do i get to|take me to|map of|where is)\s+(.+?)(?:\s+(?:today|tomorrow|this morning|this afternoon|tonight|now|later|next week)\b|[?.!,]|$)/i);
      const destination = match && match[1] ? match[1].trim() : '';
      if (/\b(where am i|my current location|current location|my position)\b/i.test(userText)) {
        throw new Error('Pulse does not yet have the main appÃ¢â‚¬â„¢s GPS-location bridge. You can still open Google Maps and use its location permission.');
      }
      const mapUrl = destination
        ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(destination)
        : 'https://www.google.com/maps';
      const directionsUrl = destination
        ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destination)
        : mapUrl;
      return 'Tool: maps_navigation. Give the user these direct links:\nMap: ' + mapUrl + '\nDirections: ' + directionsUrl;
    }

    return '';
  }


function setOrbState(state){try{if(window.AuroraOverlay&&AuroraOverlay.setOrbState)AuroraOverlay.setOrbState(state)}catch(e){}}
function showInstalledApps(){const list=document.getElementById('appList');list.innerHTML='';list.classList.add('open');let apps=[];try{apps=JSON.parse(AuroraOverlay.getInstalledApps()||'[]')}catch(e){}if(!apps.length){showReply('No launchable apps were returned by Android.');return}apps.sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,30).forEach(app=>{const b=document.createElement('button');b.className='app-item';b.textContent=app.name;b.onclick=()=>{try{const r=JSON.parse(AuroraOverlay.openApp(app.packageName)||'{}');showReply(r.message||('Opening '+app.name));list.classList.remove('open')}catch(e){showReply('Android could not open '+app.name)}};list.appendChild(b)});showReply('Choose an installed app to open.')}
let currentAssistantBubble=null;let typingTimer=null;function appendUserMessage(t){const e=document.getElementById('reply');e.style.display='flex';const b=document.createElement('div');b.className='message user';b.textContent=t;e.appendChild(b);e.scrollTop=e.scrollHeight}function showReply(t){const e=document.getElementById('reply');e.style.display='flex';if(!currentAssistantBubble){currentAssistantBubble=document.createElement('div');currentAssistantBubble.className='message assistant';e.appendChild(currentAssistantBubble)}if(typingTimer){clearInterval(typingTimer);typingTimer=null}if(String(t).includes('is thinking')){currentAssistantBubble.className='message assistant thinking';currentAssistantBubble.textContent='AURORA is thinking';const dots=document.createElement('span');dots.className='thinking-dots';currentAssistantBubble.appendChild(dots)}else{currentAssistantBubble.className='message assistant';const value=String(t||'');currentAssistantBubble.textContent='';let i=0;typingTimer=setInterval(()=>{currentAssistantBubble.textContent=value.slice(0,Math.min(value.length,i+=3));e.scrollTop=e.scrollHeight;if(i>=value.length){clearInterval(typingTimer);typingTimer=null}},12)}e.scrollTop=e.scrollHeight}
function hideToolPanels(){document.getElementById('appList').classList.remove('open');document.getElementById('taskPanel').classList.remove('open')}
function loadTasks(){let a=[];try{a=JSON.parse(localStorage.getItem('aurora-pulse-tasks')||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function renderTasks(){const root=document.getElementById('taskRows');root.innerHTML='';const tasks=loadTasks();if(!tasks.length){root.textContent='No tasks yet. Add your first task below.';return}tasks.forEach((t,i)=>{const row=document.createElement('label');row.className='task-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.onchange=()=>{const a=loadTasks();a[i].done=cb.checked;localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));renderTasks()};const span=document.createElement('span');span.textContent=t.text;span.style.textDecoration=t.done?'line-through':'none';row.append(cb,span);root.appendChild(row)})}
function addTask(){const input=document.getElementById('taskInput'),value=input.value.trim();if(!value)return;const a=loadTasks();a.push({text:value,done:false,createdAt:Date.now()});localStorage.setItem('aurora-pulse-tasks',JSON.stringify(a));input.value='';renderTasks()}
async function tool(n){const p=document.getElementById('prompt');document.getElementById('cards').classList.remove('open');hideToolPanels();if(n==='Open Apps'){showInstalledApps();return}if(n==='Tasks'){document.getElementById('taskPanel').classList.add('open');renderTasks();return}if(n==='Calendar'){try{const r=JSON.parse(AuroraOverlay.openCalendar()||'{}');showReply(r.message||'Opening your calendar.')}catch(e){showReply('Could not open your calendar app.')}return}if(n==='Email'){try{const r=JSON.parse(AuroraOverlay.composeEmail()||'{}');showReply(r.message||'Opening your email app.')}catch(e){showReply('Could not open your email app.')}return}const q={'Weather':'What is the weather?','More tools':'Show me more tools'};p.value=q[n]||n;sendPrompt()}
async function sendPrompt(){const p=document.getElementById('prompt'),t=p.value.trim();if(!t)return;appendUserMessage(t);currentAssistantBubble=null;setOrbState('thinking');showReply('AURORA is thinking…');document.querySelector('.send').disabled=true;try{const nativeAction=await tryHandleNativeAppCommand(t);if(nativeAction&&nativeAction.handled){showReply(nativeAction.reply);setOrbState('speaking');p.value='';return}const toolContext=await getOverlayToolContext(t);const r=await fetch('https://aurora-ten-gold.vercel.app/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}],profile:{},toolContext})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch(e){}if(!r.ok)throw new Error(d.error||('Chat API HTTP '+r.status));showReply(String(d.reply||'AURORA returned an empty response.'));setOrbState('speaking');p.value=''}catch(e){showReply(e.message||'Could not reach AURORA.');setOrbState('idle')}finally{document.querySelector('.send').disabled=false;setTimeout(()=>setOrbState('idle'),3500)}}document.getElementById('prompt').addEventListener('focus',()=>setOrbState('listening'));document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendPrompt()}});

(function(){const grip=document.querySelector('.drag-grip');if(!grip)return;let active=false,lastX=0,lastY=0;grip.addEventListener('pointerdown',e=>{active=true;lastX=e.clientX;lastY=e.clientY;grip.setPointerCapture(e.pointerId);e.preventDefault()});grip.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(window.AuroraOverlay&&AuroraOverlay.movePanelBy)AuroraOverlay.movePanelBy(dx,dy)});const stop=()=>{active=false};grip.addEventListener('pointerup',stop);grip.addEventListener('pointercancel',stop)})();
</script></body></html>
